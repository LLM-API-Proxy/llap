# docker/docker-compose.prod.yml — Production-grade Docker Compose configuration.
#
# This file extends the base docker-compose.yml with production-specific
# settings: resource limits, health checks, persistent volumes, TLS termination
# via Traefik, and observability via Prometheus + Grafana.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Or standalone (supplies all services):
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Environment variables are loaded from a `.env` file in the same directory.
# See `tls.env.example` for the required variables.

services:

  # ─── TimescaleDB ─────────────────────────────────────────────────────────────
  timescaledb:
    # PINNED (#1325): concrete tag + digest, not the floating `latest-pg18`, so
    # the data-volume migration path stays reproducible. Bump deliberately.
    image: timescale/timescaledb:2.27.2-pg18@sha256:4051ec6e2c6c5b31fe789cf2cd87991ee1490b312b77fe02efaf51bec84b89b7
    restart: unless-stopped
    # ── Connection budget (issue #1288) ───────────────────────────────────────
    # Raise max_connections to 100 so the proxy's connection budget (control
    # pool + data pool = 25 by default) plus headroom for migrations, psql, and
    # background tooling never saturates the server. Running the Postgres default
    # of 25 let the app pool alone exhaust the server during the post-deploy
    # background write storm, starving the request path → a brief HTTP 500 burst
    # on every deploy.
    #
    # Keep PROXY_DATABASE__CONTROL_POOL_SIZE + PROXY_DATABASE__DATA_POOL_SIZE
    # well below this value if you tune the app pool.
    #
    # ── Optional Postgres RAM tuning (issue #1305) ────────────────────────────
    # Shell (string) form on purpose: the conditional ${VAR:+...} tokens word-
    # split into separate args and vanish cleanly when unset, so the rendered
    # command defaults to exactly "postgres -c max_connections=100" (byte-
    # identical to prior releases). An empty `-c shared_buffers=` value is FATAL
    # to Postgres, so the flags must be omitted entirely (not defaulted to an
    # empty string) when unset. shared_preload_libraries=timescaledb (set by the
    # entrypoint in postgresql.conf) is untouched by these flags. Opt in via .env:
    #   TIMESCALEDB_SHARED_BUFFERS=4GB  TIMESCALEDB_EFFECTIVE_CACHE_SIZE=8GB  TIMESCALEDB_WORK_MEM=64MB
    command: -c max_connections=100 ${TIMESCALEDB_SHARED_BUFFERS:+-c shared_buffers=${TIMESCALEDB_SHARED_BUFFERS}} ${TIMESCALEDB_EFFECTIVE_CACHE_SIZE:+-c effective_cache_size=${TIMESCALEDB_EFFECTIVE_CACHE_SIZE}} ${TIMESCALEDB_WORK_MEM:+-c work_mem=${TIMESCALEDB_WORK_MEM}}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_proxy}
      POSTGRES_USER: ${POSTGRES_USER:-proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # ── DB data dir mount (issue #1305) ───────────────────────────────────────
      # DEFAULT (TIMESCALEDB_DATA_PATH unset): named volume timescaledb_data at
      # the SAME target path this file has always used — byte-identical to prior
      # releases so a prod.yml-standalone deployment finds its data in the exact
      # same place on upgrade (zero data-loss risk). The default target is NOT
      # changed here: silently relocating an existing deployment's mount could
      # mount an empty volume over live ephemeral data and lose it.
      #
      # KNOWN INCONSISTENCY (not changed by default): the pg18 image's real PGDATA
      # is /var/lib/postgresql/18/docker (as used by the base docker-compose.yml /
      # installer stack), whereas this file historically mounts the volume at
      # /var/lib/postgresql/data. The installer stack (base+hardened) — which is
      # what live production runs — is already on the correct path. A standalone
      # prod.yml deployment that wants the corrected path must migrate data
      # deliberately (see docs/operations/database-tuning.md); it is not forced as
      # a default here to avoid any data-loss path on upgrade.
      #
      # OPT-IN (TIMESCALEDB_DATA_PATH=/mnt/ssd/pgdata): bind mount to that host
      # path instead. Switching does NOT migrate data — copy/restore it first.
      - ${TIMESCALEDB_DATA_PATH:-timescaledb_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxy} -d ${POSTGRES_DB:-llm_proxy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "${TIMESCALEDB_CPU_LIMIT:-1.0}"
          # Configurable DB memory limit (issue #1305). DEFAULT 1g preserves this
          # file's prior behaviour; raise via .env (e.g. TIMESCALEDB_MEMORY_LIMIT=8g)
          # alongside the TIMESCALEDB_SHARED_BUFFERS / _EFFECTIVE_CACHE_SIZE tuning
          # flags above so an existing volume actually uses the extra RAM.
          memory: ${TIMESCALEDB_MEMORY_LIMIT:-1g}
        reservations:
          cpus: "0.25"
          memory: 256m

  # ─── Consul (service discovery / KV store) ────────────────────────────────────
  consul:
    image: hashicorp/consul:1.22
    restart: unless-stopped
    command: >-
      consul agent
      -server
      -bootstrap-expect 1
      -client=[::]
      -data-dir=/consul/data
      -acl-default-policy=deny
      -acl-enable-token-persistence=true
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://[::1]:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  # ─── Consul KV init (one-shot) ───────────────────────────────────────────────
  # Seeds Traefik TLS options into Consul KV before Traefik starts, and
  # provisions ACL policies + tokens for the backup subsystem (#279).
  #
  # Must run after Consul is healthy and must complete successfully before
  # Traefik is allowed to start (see traefik.depends_on below).
  #
  # Requires Docker Compose v2.1+ for service_completed_successfully condition.
  #
  # In prod, Consul is reachable at consul:8500 via the Docker bridge network.
  #
  # ACL policy/token provisioning:
  #   consul-init creates two least-privilege policies and their tokens on every
  #   run.  All create operations are idempotent: duplicate names are silently
  #   ignored (exit 0) and the existing policy/token is left untouched.
  #   Token SecretIDs are printed to stdout so operators can capture them on the
  #   first run and store them in their .env file.
  #
  #   Policies created:
  #     backup-agent-write     — write on proxy/backup/* (backup service)
  #     proxy-server-backup-rw — read/write on proxy/backup/* (proxy-server)
  #
  #   Tokens created (description used as stable idempotency key):
  #     backup-agent-token        → set as BACKUP_CONSUL_HTTP_TOKEN
  #     proxy-server-backup-token → set as PROXY_BACKUP_CONSUL_TOKEN
  consul-init:
    image: hashicorp/consul:1.22
    # restart: "no" — one-shot init container; must not be restarted after exit.
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - proxy-net
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      # ACL management token for consul-init.  Must have acl:write permission.
      # On first deploy this is the bootstrap management token (obtained via
      # `consul acl bootstrap`).  See tls.env.example for the bootstrap procedure.
      # Leave empty in ACL-disabled environments (e.g. dev compose which uses
      # Consul dev mode without ACL).
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      # backend-unavailable responder URL (issue #1334). In prod, Traefik and the
      # responder share the proxy-net bridge, so Traefik reaches it by Docker DNS.
      TRAEFIK_UNAVAILABLE_BACKEND_URL: ${TRAEFIK_UNAVAILABLE_BACKEND_URL:-http://backend-unavailable:80}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        # ── Traefik TLS KV options ─────────────────────────────────────────────
        # Idempotent: only write each key if it does not already exist.
        # This makes re-deploys safe — no data is overwritten.
        consul kv get traefik/tls/options/strong-tls/minVersion > /dev/null 2>&1 || \
          consul kv put traefik/tls/options/strong-tls/minVersion VersionTLS12
        consul kv get traefik/tls/options/strong-tls/cipherSuites/0 > /dev/null 2>&1 || {
          consul kv put traefik/tls/options/strong-tls/cipherSuites/0 TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          consul kv put traefik/tls/options/strong-tls/cipherSuites/1 TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          consul kv put traefik/tls/options/strong-tls/cipherSuites/2 TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          consul kv put traefik/tls/options/strong-tls/cipherSuites/3 TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          consul kv put traefik/tls/options/strong-tls/cipherSuites/4 TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
          consul kv put traefik/tls/options/strong-tls/cipherSuites/5 TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        }

        # ── backend-unavailable 503 fallback (issue #1334) ─────────────────────
        # Lifecycle-independent Consul KV routing that returns a RETRYABLE 503
        # (Retry-After + Anthropic overloaded_error envelope) instead of a 404
        # when the proxy backend is offline. Living in Consul KV (not Docker
        # labels) means it survives the proxy-server container disappearing.
        # Idempotent: only writes keys that do not already exist.
        #
        # $${TRAEFIK_UNAVAILABLE_BACKEND_URL} is escaped so Compose passes a
        # literal $VAR to the shell; the value comes from the container ENV above.
        #
        # 1. Static responder service. Write the URL EVERY run: it is
        #    infrastructure-derived (tracks the networking mode), not an operator
        #    preference, so self-healing topology drift is correct. The
        #    middleware/router blocks below keep write-if-absent so operator
        #    overrides survive.
        consul kv put traefik/http/services/backend-unavailable/loadBalancer/servers/0/url "$${TRAEFIK_UNAVAILABLE_BACKEND_URL}"
        # 2. errors middleware for a dead-but-present backend (502/503/504).
        consul kv get traefik/http/middlewares/service-unavailable/errors/status/0 > /dev/null 2>&1 || {
          consul kv put traefik/http/middlewares/service-unavailable/errors/status/0 502
          consul kv put traefik/http/middlewares/service-unavailable/errors/status/1 503
          consul kv put traefik/http/middlewares/service-unavailable/errors/status/2 504
          consul kv put traefik/http/middlewares/service-unavailable/errors/service backend-unavailable@consul
          consul kv put traefik/http/middlewares/service-unavailable/errors/query /
        }
        # 3. Lowest-priority catch-all router for the no-matching-router 404 case.
        consul kv get traefik/http/routers/backend-unavailable/rule > /dev/null 2>&1 || {
          consul kv put traefik/http/routers/backend-unavailable/rule 'PathPrefix(`/`)'
          consul kv put traefik/http/routers/backend-unavailable/entryPoints/0 websecure
          consul kv put traefik/http/routers/backend-unavailable/priority 1
          consul kv put traefik/http/routers/backend-unavailable/service backend-unavailable@consul
          consul kv put traefik/http/routers/backend-unavailable/tls/options strong-tls
        }

        # ── Backup ACL policies ────────────────────────────────────────────────
        # Skip policy/token provisioning when no management token is set.
        # This keeps the init container functional in ACL-disabled dev environments.
        if [ -n "${CONSUL_HTTP_TOKEN:-}" ]; then

          # Policy: backup-agent-write
          # Grants write (which implies read) on the proxy/backup/ KV prefix.
          # Used by the restic backup agent to publish heartbeat, status, and job
          # results, and to consume trigger requests written by the proxy-server.
          consul acl policy create \
            -name "backup-agent-write" \
            -description "Backup agent: write proxy/backup/* KV keys" \
            -rules 'key_prefix "proxy/backup/" { policy = "write" }' 2>/dev/null \
          || consul acl policy update \
            -name "backup-agent-write" \
            -description "Backup agent: write proxy/backup/* KV keys" \
            -rules 'key_prefix "proxy/backup/" { policy = "write" }'

          # Policy: proxy-server-backup-rw
          # Grants write (which implies read) on the proxy/backup/ KV prefix.
          # Used by the proxy-server to trigger backup runs, read current status,
          # and write operator configuration.  Narrowly scoped — no access to
          # traefik/ or any other KV prefix.
          consul acl policy create \
            -name "proxy-server-backup-rw" \
            -description "Proxy server: read/write proxy/backup/* KV keys" \
            -rules 'key_prefix "proxy/backup/" { policy = "write" }' 2>/dev/null \
          || consul acl policy update \
            -name "proxy-server-backup-rw" \
            -description "Proxy server: read/write proxy/backup/* KV keys" \
            -rules 'key_prefix "proxy/backup/" { policy = "write" }'

          # Token: backup-agent-token
          # Idempotent: only create if no token with this description exists.
          # Tokens are stored in Consul's token store only — never in KV or files.
          EXISTING=$(consul acl token list -format=json 2>/dev/null | \
            grep -o '"Description":"backup-agent-token"' | head -1) || EXISTING=""
          if [ -z "$EXISTING" ]; then
            echo ">>> Creating backup-agent-token — copy SecretID to BACKUP_CONSUL_HTTP_TOKEN"
            consul acl token create \
              -description "backup-agent-token" \
              -policy-name "backup-agent-write"
          else
            echo ">>> backup-agent-token already exists — skipping creation"
          fi

          # Token: proxy-server-backup-token
          EXISTING2=$(consul acl token list -format=json 2>/dev/null | \
            grep -o '"Description":"proxy-server-backup-token"' | head -1) || EXISTING2=""
          if [ -z "$EXISTING2" ]; then
            echo ">>> Creating proxy-server-backup-token — copy SecretID to PROXY_BACKUP_CONSUL_TOKEN"
            consul acl token create \
              -description "proxy-server-backup-token" \
              -policy-name "proxy-server-backup-rw"
          else
            echo ">>> proxy-server-backup-token already exists — skipping creation"
          fi

        else
          echo ">>> CONSUL_HTTP_TOKEN not set — skipping ACL policy/token provisioning (dev/ACL-disabled mode)"
        fi
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64m

  # ─── Proxy server ─────────────────────────────────────────────────────────────
  proxy-server:
    image: ghcr.io/llm-api-proxy/server:${PROXY_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proxy}:${POSTGRES_PASSWORD:?}@timescaledb:5432/${POSTGRES_DB:-llm_proxy}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PROXY_KEK_VALUE: ${PROXY_KEK_VALUE:?PROXY_KEK_VALUE must be set}
      PROXY_LISTEN_ADDR: "::"
      PROXY_LISTEN_PORT: ${PROXY_LISTEN_PORT:-8080}
      PROXY_FORWARD_PROXY__PORT: ${PROXY_FORWARD_PROXY__PORT:-3001}
      # Forward proxy CA storage directory — persisted via the proxy_ca_data named volume.
      # The ca_storage_dir config field (added in #243) reads this env var on startup.
      PROXY_CA_STORAGE_DIR: "/ca"
      # Consul token for the proxy-server to read/write the proxy/backup/* KV prefix.
      # Provisioned by consul-init (proxy-server-backup-rw policy, #279).
      # Obtain the SecretID from consul-init output on first deploy, then set in docker/.env.
      # Leave empty to disable backup KV integration (backups will not be triggered via KV).
      PROXY_BACKUP_CONSUL_TOKEN: ${PROXY_BACKUP_CONSUL_TOKEN:-}
    volumes:
      # Named volumes are writable even when read_only: true is set on the container.
      # The read-only flag applies to the container's root filesystem overlay only;
      # explicitly mounted named volumes remain writable and survive container restarts.
      - proxy_ca_data:/ca
    ports:
      - "${PROXY_PORT:-8080}:${PROXY_LISTEN_PORT:-8080}"
    depends_on:
      timescaledb:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      # Use the built-in healthcheck subcommand — no wget or shell required.
      # This is compatible with both the distroless (production) and debian-slim
      # (debug) runtime bases.
      test: ["CMD", "/app/proxy-server", "healthcheck"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 60s
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 128m
    labels:
      - traefik.enable=true
      # HTTP router — handles all HTTPS requests via the websecure entrypoint.
      # Network topology note: in this prod compose both Traefik and proxy-server
      # use the default Docker bridge network (not host networking). Traefik resolves
      # the proxy-server backend by Docker hostname. Backend URL uses the service name
      # and the PROXY_LISTEN_PORT above, NOT [::1]:3000 which is the dev default.
      - "traefik.http.routers.proxy-api.rule=PathPrefix(`/`)"
      - traefik.http.routers.proxy-api.entrypoints=websecure
      - traefik.http.routers.proxy-api.service=proxy-backend
      # service-unavailable@consul is the errors middleware seeded into Consul KV
      # by consul-init (issue #1334). It catches a dead-but-present backend
      # (502/503/504) and serves the retryable backend-unavailable 503 envelope so
      # Claude CLI retries instead of treating the blip as a model-access error.
      # NO large-body@docker here (issue #1474): Traefik's `buffering` middleware
      # reads the ENTIRE response into memory before forwarding it — there is NO
      # "buffering off" toggle, and `maxResponseBodyBytes=0` only disables the
      # response SIZE LIMIT, not the buffering itself. Attaching it to this router
      # therefore breaks SSE streaming: the client receives the whole stream as one
      # burst at the end (measured: time_starttransfer == time_total). The proxy
      # streams live on its own (verified direct-to-backend: TTFB << total), so the
      # data plane must NOT be wrapped in a response-buffering middleware. Request
      # body-size limits are enforced by the proxy itself (reject_request_bytes), so
      # dropping Traefik's request cap here is safe. (large-body remains available
      # for non-streaming routes like grafana/prometheus — see docker-compose.monitoring.yml.)
      - traefik.http.routers.proxy-api.middlewares=service-unavailable@consul,hsts@docker
      # TLS options reference the Consul KV provider (see issue #242 — Consul KV must be
      # active for this to take effect; falls back to default TLS options otherwise).
      # Uses @consul suffix (migrated from @file provider in issue #241).
      - traefik.http.routers.proxy-api.tls.options=strong-tls@consul
      # ACME certificate resolver — DNS-01 via Cloudflare (activated by docker-compose.tls.yml).
      # The certresolver flag is inert when no --certificatesresolvers.cloudflare.* flags are
      # set in the Traefik command, so it is safe to include here unconditionally.
      - traefik.http.routers.proxy-api.tls.certresolver=cloudflare
      # HSTS middleware — forces HTTPS with long max-age.
      # WARNING: stsIncludeSubdomains=true commits ALL subdomains to HTTPS.
      # stsPreload=false is the safe default — enabling preload is near-permanent.
      - traefik.http.middlewares.hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true
      - "traefik.http.middlewares.hsts.headers.stsPreload=false"
      - traefik.http.middlewares.hsts.headers.forceSTSHeader=true
      # Body size middleware — allows up to 1 GiB requests.
      # WARNING (issue #1474): a Traefik `buffering` middleware ALWAYS buffers the
      # full RESPONSE body before forwarding it — `maxResponseBodyBytes=0` only
      # disables the response size LIMIT (no 500 on a large response), it does NOT
      # turn response buffering off (there is no such toggle). NEVER attach this
      # middleware to a streaming/SSE route (the proxy-api router above) or the
      # client gets the whole stream in one terminal burst. It is defined here (on
      # the proxy container, the canonical owner of shared middlewares) and used
      # ONLY by the non-streaming grafana/prometheus routers in
      # docker-compose.monitoring.yml. The proxy enforces its own request-body cap
      # (reject_request_bytes), so the data plane needs no Traefik request limit.
      # memRequestBodyBytes=1048576: request bodies ≤1 MiB stay in memory; larger spill to disk.
      - "traefik.http.middlewares.large-body.buffering.maxRequestBodyBytes=1073741824"
      - "traefik.http.middlewares.large-body.buffering.maxResponseBodyBytes=0"
      - "traefik.http.middlewares.large-body.buffering.memRequestBodyBytes=1048576"
      # HTTP service — backend URL uses Docker hostname resolution.
      # proxy-server listens on [::]:8080 in the prod compose network.
      # Using http:// because TLS terminates at Traefik.
      - "traefik.http.services.proxy-backend.loadbalancer.server.url=http://proxy-server:${PROXY_LISTEN_PORT:-8080}"
      # Disable buffering for SSE streaming support
      - traefik.http.services.proxy-backend.loadbalancer.responseForwarding.flushInterval=1ms
      # TCP router — passthrough for the forward proxy (CONNECT mode / TLS interception).
      - "traefik.tcp.routers.forward-proxy.rule=HostSNI(`*`)"
      - traefik.tcp.routers.forward-proxy.entrypoints=forward-proxy
      - traefik.tcp.routers.forward-proxy.service=proxy-forward
      # TCP service — use the same canonical typed port supplied to the listener.
      - "traefik.tcp.services.proxy-forward.loadbalancer.server.address=proxy-server:${PROXY_FORWARD_PROXY__PORT:-3001}"

  # ─── backend-unavailable responder (issue #1334) ─────────────────────────────
  # Always-up static sidecar that answers EVERY request with a retryable HTTP 503
  # (Retry-After header + Anthropic overloaded_error envelope). Traefik routes
  # here — via the Consul KV catch-all router and the service-unavailable errors
  # middleware seeded by consul-init above — whenever the proxy backend is offline,
  # so Claude Code/CLI retries the blip instead of reading a 404 as "model not
  # found / no access". Reached by Docker DNS at backend-unavailable:80 (prod uses
  # bridge networking, so no published host port is needed). TLS terminates at
  # Traefik, so the responder speaks plain HTTP.
  backend-unavailable:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./backend-unavailable/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Security hardening — the stock nginx:alpine image writes its pid and temp
    # paths under /var; a read-only rootfs plus tmpfs for those paths keeps the
    # container locked down while serving a static 503.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nginx writes its pid and switches worker uid/gid (CHOWN/SETGID/SETUID) and
      # binds the privileged port 80 (NET_BIND_SERVICE). Without NET_BIND_SERVICE,
      # binding :80 fails on runtimes that do not allow unprivileged low ports.
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32m
        reservations:
          cpus: "0.05"
          memory: 16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Traefik (TLS termination) ────────────────────────────────────────────────
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      # Consul KV provider: TLS options are seeded into Consul by consul-init (#240).
      # In prod, Traefik is on proxy-net and reaches Consul via Docker DNS at consul:8500.
      # rootkey=traefik matches the KV prefix used by consul-init.
      #
      # Startup race note: if Consul is unavailable when Traefik starts, Traefik
      # will load no TLS options from Consul and fall back to defaults (TLS 1.0
      # allowed). The depends_on: consul-init: service_completed_successfully ordering
      # below prevents this under normal operation.
      - "--providers.consul.endpoints=consul:8500"
      - "--providers.consul.rootkey=traefik"
      # Docker provider: discovers routing config from container labels
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      # File provider: operator drop-in directory (issue #1340).
      # A watched, read-only directory where operators may drop site-specific
      # Traefik dynamic config (*.yml/*.toml) — custom routers, middlewares,
      # redirects, headers — WITHOUT modifying the product templates. EMPTY by
      # default: a clean install loads nothing here, so behaviour is unchanged
      # until an operator drops a file. Coexists with the consul + docker
      # providers above. See docs/tls-setup.md ("Operator Traefik drop-in").
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.forward-proxy.address=:8443"
      # Disable response buffering for SSE streaming
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=180s"
      - "--api=false"
      - "--log.level=INFO"
      - "--accesslog=true"
      # Metrics for Prometheus scraping
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      # Docker socket for label-based service discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Operator drop-in directory for custom Traefik dynamic config (issue #1340).
      # Read-only: Traefik only watches/reads it, never writes. Relative to this
      # compose file, so it resolves to <install-dir>/docker/traefik-dynamic/.
      # Created empty by install.sh and preserved (never wiped) on upgrade.
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
    environment:
      # ACL token for Traefik (traefik-read policy: read on traefik/* KV prefix).
      # Traefik reads this via the standard CONSUL_HTTP_TOKEN env var when communicating
      # with the ACL-enabled Consul KV provider. Set in docker/.env — see tls.env.example
      # for the ACL bootstrap procedure.
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
    depends_on:
      proxy-server:
        condition: service_healthy
      consul:
        condition: service_healthy
      consul-init:
        condition: service_completed_successfully
      # backend-unavailable must be up so the 503 fallback responder is reachable
      # the moment Traefik starts routing (issue #1334).
      backend-unavailable:
        condition: service_started
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  # ─── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - proxy-server
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  # ─── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # ─── Proxy TUI (optional — enable with --profile tui) ────────────────────────
  proxy-tui:
    image: ghcr.io/llm-api-proxy/cli:${PROXY_VERSION:-latest}
    profiles: ["tui"]
    environment:
      PROXY_API_URL: http://proxy-server:8080
    depends_on:
      - proxy-server
    stdin_open: true
    tty: true
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m

networks:
  proxy-net:
    driver: bridge

volumes:
  timescaledb_data:
  consul_data:
  prometheus_data:
  grafana_data:
  # Persistent storage for the forward proxy CA certificate and key.
  # Backup: docker run --rm -v proxy_ca_data:/ca -v $PWD:/backup busybox tar czf /backup/ca_backup.tar.gz /ca
  proxy_ca_data:
