# docker/docker-compose.monitoring.yml — Prometheus + Grafana + Alertmanager monitoring overlay.
#
# Adds Prometheus, Grafana, Alertmanager and cAdvisor on the proxy_net bridge
# network. Services are served via Traefik subpath routing:
#   /grafana      → Grafana (port 3000)
#   /prometheus   → Prometheus (port 9090)
#   /alertmanager → Alertmanager (port 9093, internal only — not exposed via Traefik)
#   cadvisor      → not routed: scraped over proxy_net at cadvisor:8080 (#1697)
#
# Alertmanager config:
#   Copy docker/alertmanager/alertmanager.yml to docker/alertmanager/alertmanager.local.yml
#   and populate the placeholder webhook URLs and PagerDuty key before starting.
#   The local override is mounted when present; the template is used otherwise
#   (alerts will fire to dead-letter receivers until configured).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Middleware source (issue #1951): these routers use `large-body@consul`, seeded
# into Consul KV by the base compose's consul-init service. It used to be
# `large-body@docker`, defined on the PROXY container's labels — and Traefik's
# Docker provider drops every label of a container that is not Docker-healthy, so
# both routers failed to load with `middleware "large-body@docker" does not
# exist` for the whole of each proxy start-up window.

services:
  # ── cAdvisor — per-container cgroup counters (#1697) ────────────────────────
  #
  # WHY THIS SERVICE EXISTS
  # -----------------------
  # Production OOM-killed 32 PostgreSQL backends between 2026-07-02 and
  # 2026-07-14. The kernel killed individual backends, so the postmaster and the
  # container stayed up: restart_count was 0 and no health check ever noticed.
  # cAdvisor exposes the cgroup OOM-kill counter (`container_oom_events_total`,
  # fed from cgroup v2 `memory.events` `oom_kill`) plus the working-set and
  # limit gauges, which the llap-database-oom rules alert on. It is the metric
  # source for that alert group; without it the rules are inert (which the
  # LLAPDatabaseOOMMetricsAbsent rule pages on).
  #
  # EXPOSURE: internal to proxy_net only — no host port is published, so it is
  # reachable by Prometheus at `cadvisor:8080` and by nothing else. Monitoring
  # is opt-in (`--no-monitoring` disables this whole overlay).
  #
  # PRIVILEGE: the host mounts are read-only and this is the documented cAdvisor
  # configuration for reading Docker's per-container cgroups. It does not mount
  # application data or the proxy's credentials.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    networks:
      - proxy_net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    networks:
      - proxy_net
    ports:
      - "[::1]:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      # alertmanager.yml is the committed template (alerts go to dead-letter receivers).
      # To configure real routing, copy to alertmanager.local.yml (git-ignored),
      # populate the placeholders, and override this mount in a local compose overlay.
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://alertmanager:9093"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.4.0
    networks:
      - proxy_net
    ports:
      - "[::1]:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # Read-only `prx-ro-` scrape credential for the authenticated /metrics
      # endpoint, provisioned by install.sh (provision_monitoring_scrape_key).
      # Prometheus re-reads it every scrape, so rotating the key needs no reload.
      # The installer creates the file before `compose up` so the bind-mount
      # preflight (#1390) never sees a missing source and Docker never
      # auto-creates a directory here (#1881).
      - ./prometheus/llap-metrics.token:/etc/prometheus/llap-metrics.token:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alertmanager:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/prometheus/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.service=prometheus-backend
      - traefik.http.routers.prometheus.middlewares=large-body@consul
      - "traefik.http.services.prometheus-backend.loadbalancer.server.url=http://[::1]:9090"

  grafana:
    image: grafana/grafana:11.6.0
    networks:
      - proxy_net
    ports:
      - "[::1]:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.service=grafana-backend
      - traefik.http.routers.grafana.middlewares=large-body@consul
      - "traefik.http.services.grafana-backend.loadbalancer.server.url=http://[::1]:3000"

volumes:
  prometheus_data:
  grafana_data:
