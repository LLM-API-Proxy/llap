services:
  timescaledb:
    # PINNED (#1325): a concrete TimescaleDB+pg18 tag with its digest, not the
    # floating `latest-pg18`. A floating tag means two installs days apart can
    # land on different Postgres builds, and an `upgrade` that preserves the data
    # volume can pull an image incompatible with the on-disk data directory.
    # Bump deliberately (and verify data-volume compatibility) when updating.
    image: timescale/timescaledb:2.27.2-pg18@sha256:4051ec6e2c6c5b31fe789cf2cd87991ee1490b312b77fe02efaf51bec84b89b7
    # ── Connection budget (issue #1288) ───────────────────────────────────────
    # Raise max_connections to 100 so the proxy's connection budget (control
    # pool + data pool) plus headroom for migrations, psql, and background
    # tooling never saturates the server. install.sh auto-sizes the two pools
    # from the host CPU count (#1416), clamped so their sum stays well below this
    # ceiling (worst case 32 + 56 = 88, leaving 12 free). The previous deployment ran
    # the Postgres default of 25, which the app pool alone could exhaust during
    # the post-deploy background write storm, starving the request path and
    # producing a brief HTTP 500 burst on every deploy.
    #
    # Relationship to the app pool (see config.example.toml [database]):
    #   max_connections (100)  >>  control_pool_size (5) + data_pool_size (20)
    # Adjust PROXY_DATABASE__CONTROL_POOL_SIZE / __DATA_POOL_SIZE together with
    # this value if you tune the app pool; keep their sum well below it.
    #
    # ── Optional Postgres RAM tuning (issue #1305) ────────────────────────────
    # timescaledb-tune runs ONCE on first init and writes shared_buffers /
    # effective_cache_size into the data volume's postgresql.conf. Raising the
    # container memory limit alone does NOT retune an existing volume, so these
    # `-c` flags let an operator override the stored values for an EXISTING DB.
    #
    # SAFETY — defaults preserve current behaviour EXACTLY:
    #   When TIMESCALEDB_SHARED_BUFFERS / _EFFECTIVE_CACHE_SIZE / _WORK_MEM are
    #   unset, the `${VAR:+...}` substitutions collapse to nothing and the
    #   rendered command is byte-identical to "postgres -c max_connections=100".
    #   No `-c shared_buffers=...` flag is emitted, so the values stored in the
    #   existing volume's postgresql.conf (e.g. timescaledb-tune's) are untouched.
    #   An empty `-c shared_buffers=` value is FATAL to Postgres, which is why the
    #   flag must be omitted entirely (not defaulted to an empty string) when unset.
    #
    # IMPORTANT: this is the SHELL (string) form of `command:` on purpose — it
    # lets the conditional `${VAR:+...}` tokens word-split into separate args and
    # vanish cleanly when unset. Keep it a single line. The image's
    # shared_preload_libraries=timescaledb (set by the entrypoint in
    # postgresql.conf) is NOT touched by these flags and remains active.
    #
    # Example (operator opts in via docker/.env):
    #   TIMESCALEDB_SHARED_BUFFERS=4GB
    #   TIMESCALEDB_EFFECTIVE_CACHE_SIZE=8GB
    #   TIMESCALEDB_WORK_MEM=64MB
    #
    # ── Columnstore allocation guard (issue #1765) ────────────────────────────
    # A columnstore batch materialises one array per column across the whole
    # batch, and PostgreSQL refuses any single allocation of 1 GB or more
    # (MaxAllocSize). With the old 2 MiB per-body capture cap the
    # request_payloads_v2 policy job crashed on 31 of its 41 production runs
    # with `invalid memory alloc request size 1444158396`.
    #
    # enable_compressor_batch_limit is ADAPTIVE — it shrinks only a batch that
    # would exceed the limit — so it is safe to set server-wide and costs
    # nothing on tables that never approach it. Verified present and settable on
    # the pinned image above (TimescaleDB 2.27.2-pg18: `SHOW` returns `on`, the
    # server starts clean).
    #
    # NOT set here: timescaledb.compression_batch_size_limit. That one is a
    # fixed cap, and request_log compresses 74 of its 82 chunks perfectly well
    # at the default 1000 — capping the whole server would permanently degrade
    # it. Migration 0108 scopes the transitional cap to the LLAP database with
    # ALTER DATABASE instead. See
    # docs/runbooks/request-payload-storage-containment.md.
    command: -c max_connections=100 -c timescaledb.enable_compressor_batch_limit=on ${TIMESCALEDB_SHARED_BUFFERS:+-c shared_buffers=${TIMESCALEDB_SHARED_BUFFERS}} ${TIMESCALEDB_EFFECTIVE_CACHE_SIZE:+-c effective_cache_size=${TIMESCALEDB_EFFECTIVE_CACHE_SIZE}} ${TIMESCALEDB_WORK_MEM:+-c work_mem=${TIMESCALEDB_WORK_MEM}}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_proxy}
      POSTGRES_USER: ${POSTGRES_USER:-proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxy_dev_password}
    ports:
      # LOOPBACK-ONLY: publish on [::1] so Postgres is reachable by the
      # host-networked proxy at localhost:5432 but NOT on any public interface.
      #
      # SECURITY (#1324): Docker publishes ports via a DNAT rule that BYPASSES
      # the host nftables/iptables INPUT chain, so a `[::]` / `0.0.0.0` bind
      # would expose Postgres to the internet on a box with a public IP,
      # regardless of the firewall the installer configures. Binding [::1] keeps
      # the DB private. Inter-container traffic uses the proxy_net docker network
      # (service name `timescaledb`), not this published port, so this is safe.
      - "[::1]:5432:5432"
    volumes:
      # ── Optional SSD bind-mount for the DB data dir (issue #1305) ──────────────
      # DEFAULT (TIMESCALEDB_DATA_PATH unset): the named volume timescaledb_data
      # mounted at the pg18 image's PGDATA — byte-identical to prior releases, so
      # an `upgrade` (which overwrites compose but preserves docker/.env) finds the
      # existing data in the exact same place. Zero data-loss risk.
      #
      # OPT-IN (TIMESCALEDB_DATA_PATH=/mnt/ssd/pgdata): compose renders a bind
      # mount to that host path instead. This does NOT migrate existing data — it
      # only points the container at the path. Moving to SSD requires the operator
      # to copy/restore the data into the new path FIRST (see docker/tls.env.example).
      # The target path /var/lib/postgresql/18/docker is unchanged in both modes.
      - ${TIMESCALEDB_DATA_PATH:-timescaledb_data}:/var/lib/postgresql/18/docker
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy -d llm_proxy"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:1.22
    # Single-node server with persistent storage.
    # Previous versions used -dev mode (in-memory), which caused complete Traefik
    # routing failure on any Consul restart — all KV data (including TLS options
    # seeded by consul-init) was lost, and Traefik's proxy-api router failed with
    # "unknown TLS options: strong-tls@consul". See issue #335.
    # -client=[::] binds the agent's HTTP API to all IPv6 interfaces INSIDE the
    # container; the published host port below is what controls external reach.
    # Traefik uses network_mode: host and reaches Consul at [::1]:8500 via the
    # loopback-only published host port below.
    command:
      - "consul"
      - "agent"
      - "-server"
      - "-bootstrap-expect=1"
      - "-client=[::]"
      - "-data-dir=/consul/data"
    ports:
      # LOOPBACK-ONLY: publish on [::1] so host-networked Traefik can reach the
      # HTTP API at [::1]:8500 but the Consul API is NOT exposed publicly.
      #
      # SECURITY (#1324): Docker's `-p` DNAT bypasses the host firewall INPUT
      # chain, so a `[::]` / `0.0.0.0` bind would expose the Consul KV/API
      # (which carries Traefik TLS config) to the internet on a public box.
      # consul-init reaches Consul over the proxy_net docker network, so this
      # loopback bind does not affect inter-container init.
      - "[::1]:8500:8500"
    volumes:
      - consul_data:/consul/data
    networks:
      - proxy_net
    healthcheck:
      # Use the HTTP API status endpoint — it is ready only after the agent is
      # fully initialised. `consul members` fires earlier and is not sufficient.
      test: ["CMD-SHELL", "curl -sf http://[::1]:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Consul KV init (one-shot) ───────────────────────────────────────────────
  # Seeds Traefik TLS options into Consul KV before Traefik starts.
  # Must run after Consul is healthy and must complete successfully before
  # Traefik is allowed to start (see traefik.depends_on below).
  #
  # Requires Docker Compose v2.1+ for service_completed_successfully condition.
  #
  # In the base (dev) compose, Consul is reachable at consul:8500 via Docker
  # bridge DNS since consul-init runs on proxy_net alongside consul.
  consul-init:
    image: hashicorp/consul:1.22
    # restart: "no" — one-shot init container; must not be restarted after exit.
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - proxy_net
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      # CONSUL_HTTP_TOKEN must be the bootstrap token written to .env by the
      # installer's ACL bootstrap step. Without it, all consul kv put calls
      # fail with 403 (default_policy: deny) and Traefik has no TLS options.
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      # backend-unavailable responder URL (issue #1334). In the base compose both
      # Traefik and the responder are reached over the host network stack, so
      # Traefik reaches the responder at the published host port [::1]:8081.
      TRAEFIK_UNAVAILABLE_BACKEND_URL: ${TRAEFIK_UNAVAILABLE_BACKEND_URL:-http://[::1]:8081}
      # ── Product data-plane topology (issue #1951) ──────────────────────────
      # The proxy-api router, its backend service and its middlewares are seeded
      # into Consul KV (see the entrypoint below) instead of being read from the
      # proxy container's Docker labels. These two URLs are the only
      # topology-dependent parts, so each overlay that changes the networking
      # mode overrides them here rather than duplicating routing labels.
      # Base compose: Traefik and the proxy both use network_mode: host, so the
      # proxy is reachable on the host loopback at PROXY_LISTEN_PORT.
      PROXY_BACKEND_URL: ${PROXY_BACKEND_URL:-http://localhost:${PROXY_LISTEN_PORT:-3000}}
      PROXY_FORWARD_BACKEND_ADDRESS: ${PROXY_FORWARD_BACKEND_ADDRESS:-localhost:${PROXY_FORWARD_PROXY__PORT:-3001}}
      # Middleware chain for the proxy-api router, in order. Overlays that add a
      # middleware (e.g. the WAF) override this whole list; service-unavailable
      # MUST stay first so a downed backend still yields the retryable envelope.
      TRAEFIK_PROXY_API_MIDDLEWARES: ${TRAEFIK_PROXY_API_MIDDLEWARES:-service-unavailable@consul,hsts@consul}
      # ACME resolver for the proxy-api router. Unchanged from the label this
      # replaces: base/dev has no `cloudflare` resolver defined, Traefik logs
      # that and serves its default certificate; the TLS overlay defines it.
      TRAEFIK_PROXY_API_CERT_RESOLVER: ${TRAEFIK_PROXY_API_CERT_RESOLVER:-cloudflare}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # ── Fail-loud ACL write gate (#1550 / #1551) ─────────────────────────
        # ALWAYS probe that we can WRITE the traefik/ KV prefix before seeding.
        # The WRITE RESULT is the discriminator, NOT token presence:
        #   * ACLs off (base/dev — anonymous writes allowed) → probe succeeds → continue.
        #   * ACLs on with an empty/invalid token (the #1550 incident) → 403 → FATAL.
        # A token-presence guard cannot tell these apart — the incident token was
        # ALSO empty — so the probe must run unconditionally. Hard-failing here makes
        # the `depends_on: consul-init: service_completed_successfully` gate block
        # Traefik and `compose up` return non-zero, instead of Traefik coming up "Up"
        # and serving 404 for everything (strong-tls@consul unresolved). The bounded
        # retry absorbs a consul leader-election / ACL-init race on a cold boot.
        # ($$VAR is escaped so Compose passes it through literally to the shell.)
        _probe_ok=0
        _try=1
        while [ "$$_try" -le 3 ]; do
          if consul kv put traefik/.consul-init-writecheck ok > /dev/null 2>&1; then
            _probe_ok=1
            break
          fi
          sleep 2
          _try=$$((_try + 1))
        done
        if [ "$$_probe_ok" -ne 1 ]; then
          echo "FATAL(consul-init): cannot write traefik/ KV — CONSUL_HTTP_TOKEN is empty or lacks key:write (403 under default_policy=deny). Traefik strong-tls@consul would be unresolved -> ingress 404. Aborting (#1550)." >&2
          exit 1
        fi
        consul kv delete traefik/.consul-init-writecheck > /dev/null 2>&1 || true
        # Idempotent: only write each key if it does not already exist.
        # This makes re-deploys safe — no data is overwritten.
        consul kv get traefik/tls/options/strong-tls/minVersion > /dev/null 2>&1 || \
          consul kv put traefik/tls/options/strong-tls/minVersion VersionTLS12
        consul kv get traefik/tls/options/strong-tls/cipherSuites/0 > /dev/null 2>&1 || {
          consul kv put traefik/tls/options/strong-tls/cipherSuites/0 TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          consul kv put traefik/tls/options/strong-tls/cipherSuites/1 TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          consul kv put traefik/tls/options/strong-tls/cipherSuites/2 TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          consul kv put traefik/tls/options/strong-tls/cipherSuites/3 TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          consul kv put traefik/tls/options/strong-tls/cipherSuites/4 TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
          consul kv put traefik/tls/options/strong-tls/cipherSuites/5 TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        }

        # ── backend-unavailable 503 fallback (issue #1334) ─────────────────────
        # Seed a lifecycle-independent Traefik routing graph into Consul KV that
        # turns a downed/absent proxy backend into a RETRYABLE 503 instead of a
        # 404. Because these keys live in Consul KV (not Docker labels) they
        # survive the proxy container being stopped/removed — which is exactly the
        # window that produced the 404 -> "pick a different model" misfire.
        #
        # Idempotent: each key is written only if it does not already exist, so
        # re-deploys never clobber operator overrides.
        #
        # NOTE: $${TRAEFIK_UNAVAILABLE_BACKEND_URL} is escaped ($$) so Docker
        # Compose passes it through to the shell as a literal $VAR — the value is
        # read from the container ENVIRONMENT (set above), not substituted by
        # Compose at render time.
        #
        # 1. Static responder service (always-up sidecar serving 503 + envelope).
        #    The URL is INFRASTRUCTURE-derived (it tracks the networking mode:
        #    host -> [::1]:8081, bridge -> backend-unavailable:80), NOT an operator
        #    preference, so write it EVERY run. This self-heals topology drift —
        #    e.g. switching base (host) to/from no-mdns (bridge) on an existing
        #    Consul volume — which a write-if-absent guard would leave stale and
        #    unreachable. The middleware/router blocks below are static definitions
        #    and keep the write-if-absent guard so operator overrides survive.
        consul kv put traefik/http/services/backend-unavailable/loadBalancer/servers/0/url "$${TRAEFIK_UNAVAILABLE_BACKEND_URL}"
        # 2. errors middleware: catch a dead-but-present backend (502/503/504) and
        #    serve the responder body. query=/ fetches the responder's catch-all
        #    503 envelope for every error.
        consul kv get traefik/http/middlewares/service-unavailable/errors/status/0 > /dev/null 2>&1 || {
          consul kv put traefik/http/middlewares/service-unavailable/errors/status/0 502
          consul kv put traefik/http/middlewares/service-unavailable/errors/status/1 503
          consul kv put traefik/http/middlewares/service-unavailable/errors/status/2 504
          consul kv put traefik/http/middlewares/service-unavailable/errors/service backend-unavailable@consul
          consul kv put traefik/http/middlewares/service-unavailable/errors/query /
        }
        # 3. Lowest-priority catch-all router: when the proxy-api Docker router has
        #    disappeared (container removed) nothing else matches, so this serves
        #    the responder directly. priority=1 guarantees the real proxy-api
        #    router (no explicit priority -> ranked by rule length) always wins
        #    while the proxy is up.
        consul kv get traefik/http/routers/backend-unavailable/rule > /dev/null 2>&1 || {
          consul kv put traefik/http/routers/backend-unavailable/rule 'PathPrefix(`/`)'
          consul kv put traefik/http/routers/backend-unavailable/entryPoints/0 websecure
          consul kv put traefik/http/routers/backend-unavailable/priority 1
          consul kv put traefik/http/routers/backend-unavailable/service backend-unavailable@consul
          consul kv put traefik/http/routers/backend-unavailable/tls/options strong-tls
        }

        # ── Product data plane: proxy-api router + service + middlewares (#1951)
        # These used to be Docker labels on the proxy container. Traefik's Docker
        # provider DROPS EVERY LABEL of a container whose Docker health status is
        # not "healthy" — including `starting`. The proxy image ships a HEALTHCHECK
        # (Dockerfile.server: start-period 30s, interval 15s, retries 3) that only
        # goes healthy once the process has finished booting and migrating, so for
        # the whole of that window the proxy-api router, the proxy-backend service,
        # `hsts` and `large-body` did not exist at all. The only remaining match for
        # `/v1/*` was the priority-1 backend-unavailable catch-all, which answered
        # 529 for 3.5 minutes on the v0.0.157 upgrade even though the proxy itself
        # was already serving 200s. It also made grafana/prometheus fail to load
        # with `middleware "large-body@docker" does not exist`, because large-body
        # was defined on the proxy container too.
        #
        # Seeding them here puts the ENTIRE product routing graph in ONE provider
        # whose delivery is ordered by compose (traefik depends_on consul-init:
        # service_completed_successfully), so a router can never be disabled by a
        # middleware or TLS option that has not arrived yet, and no part of it is
        # tied to the proxy container's lifecycle or health status.
        #
        # Written on EVERY run (no write-if-absent guard): this is the data plane,
        # it is derived from the deployment topology and the shipped release, and
        # KV drift here is an outage. Operator customisation belongs in the Traefik
        # file drop-in (docker/traefik-dynamic/), not in these keys.
        #
        # Behaviour when the proxy is DOWN keeps #1334's intent and sharpens it: the
        # router always matches, and its service is a FAILOVER service that hands
        # the request to the backend-unavailable responder while the proxy's health
        # check is failing — so the client gets the responder's own retryable status
        # and dialect rather than a raw connection error.
        #
        # Fail loud BEFORE the first write: seeding an empty backend URL would leave
        # a router pointing at nothing, which is an outage that survives the exit.
        if [ -z "$${PROXY_BACKEND_URL}" ] || [ -z "$${PROXY_FORWARD_BACKEND_ADDRESS}" ]; then
          echo "FATAL(consul-init): PROXY_BACKEND_URL / PROXY_FORWARD_BACKEND_ADDRESS are empty — the proxy-api router would be seeded with no backend and every request would fall through to the 529 responder (#1951). Aborting." >&2
          exit 1
        fi
        consul kv put traefik/http/services/proxy-backend/loadBalancer/servers/0/url "$${PROXY_BACKEND_URL}"
        # Traefik health-checks the proxy itself and fails over to the responder
        # when it is down (see the failover service below). This probe is what
        # bounds the outage window, so WHICH endpoint it hits decides whether the
        # failover can send traffic to a proxy that is not ready to serve.
        #
        # /health is the STRONGEST readiness signal LLAP exposes over HTTP, and it
        # is not a lenient liveness endpoint — that description was wrong. Per
        # crates/proxy-server/src/management/health_check.rs it runs a real query
        # against the data pool, classifies the result (classify_health_status)
        # and answers 503, not 200, when the database is unreachable, when every
        # circuit breaker is open, or when the 5-minute 5xx/timeout rate is above
        # threshold. It reports pool and circuit-breaker state on every response.
        #
        # The alternatives are all strictly weaker for this purpose:
        #   * /manage/v1/health/live and /manage/v1/health/ready (app.rs
        #     health_live / health_ready) both return a hardcoded
        #     {"status":"ok"} and check NOTHING — pointing the failover at
        #     "ready" would make it less able to spot an unready proxy, not more.
        #   * The container's own healthcheck is `proxy-server healthcheck`, a
        #     CLI subcommand, not an HTTP endpoint Traefik can call. It is also
        #     what took 3.5 minutes longer than the outage during #1951, which is
        #     why the failover must not wait on it.
        #
        # Known trade-off, recorded deliberately: because /health returns 503 when
        # the proxy is DEGRADED (one open circuit, elevated 5xx) and not only when
        # it is down, the failover will hand a degraded-but-serving proxy's
        # traffic to the responder's retryable envelope. That is the conservative
        # direction — clients back off and retry rather than receive errors — but
        # it does mean "degraded" and "down" are treated alike here.
        consul kv put traefik/http/services/proxy-backend/loadBalancer/healthCheck/path /health
        consul kv put traefik/http/services/proxy-backend/loadBalancer/healthCheck/interval 5s
        consul kv put traefik/http/services/proxy-backend/loadBalancer/healthCheck/timeout 2s
        # Disable response buffering so SSE streams flush through (issue #1474).
        consul kv put traefik/http/services/proxy-backend/loadBalancer/responseForwarding/flushInterval 1ms
        # HSTS — forces HTTPS by instructing browsers never to connect over HTTP.
        # OPERATOR WARNING: stsIncludeSubdomains=true means ALL subdomains of the
        # domain must serve HTTPS once a browser caches this header. stsPreload
        # stays false: preload is a near-permanent commitment for the whole domain
        # tree via browser preload lists.
        consul kv put traefik/http/middlewares/hsts/headers/stsSeconds 31536000
        consul kv put traefik/http/middlewares/hsts/headers/stsIncludeSubdomains true
        consul kv put traefik/http/middlewares/hsts/headers/stsPreload false
        consul kv put traefik/http/middlewares/hsts/headers/forceSTSHeader true
        # large-body — request body cap for the NON-STREAMING monitoring routers
        # (grafana/prometheus reference it as large-body@consul). It must NEVER be
        # attached to proxy-api: Traefik's `buffering` middleware always buffers the
        # whole RESPONSE before forwarding it and there is no toggle to disable that
        # (maxResponseBodyBytes=0 only removes the size LIMIT), which breaks SSE
        # streaming (issue #1474). The proxy enforces its own request cap
        # (reject_request_bytes), so the data plane needs no Traefik request limit.
        consul kv put traefik/http/middlewares/large-body/buffering/maxRequestBodyBytes 1073741824
        consul kv put traefik/http/middlewares/large-body/buffering/maxResponseBodyBytes 0
        consul kv put traefik/http/middlewares/large-body/buffering/memRequestBodyBytes 1048576
        # Failover service: the router's service is a failover wrapper, not the
        # backend directly. While proxy-backend's health check passes, requests go
        # to the proxy untouched (verified: SSE still streams, TTFB 2.5ms against a
        # 3s stream). When it fails, Traefik routes to the responder DIRECTLY, so
        # the client gets the responder's OWN status and dialect — 529 +
        # overloaded_error on the Anthropic paths, 503 + an OpenAI-shaped error on
        # /v1/responses, /v1/chat/completions and /api/* (#1334, #62).
        #
        # This is why the fallback is a failover service and not just the errors
        # middleware: Traefik's errors middleware replaces the response BODY but
        # PRESERVES the upstream status, so routing a downed backend through it
        # yields a 502 carrying a 529-flavoured body, and its single `query` fetch
        # cannot select the per-path dialect. Measured, not assumed.
        consul kv put traefik/http/services/proxy-api-failover/failover/service proxy-backend@consul
        consul kv put traefik/http/services/proxy-api-failover/failover/fallback backend-unavailable@consul
        # The errors middleware stays in the chain for the case the failover cannot
        # see: a backend that is health-check-UP but answers one request 502/504
        # (or that has just died and the next probe has not fired yet). It must
        # NEVER be given a status the responder itself returns — catching the
        # responder's own 503 would pair that 503 with the Anthropic-shaped body
        # from `query: /`. 502 and 504 are the two the responder never produces.
        # Written every run so an install seeded by an earlier release, which
        # stored 502/503/504, is corrected in place.
        consul kv put traefik/http/middlewares/service-unavailable/errors/status/0 502
        consul kv put traefik/http/middlewares/service-unavailable/errors/status/1 504
        consul kv delete traefik/http/middlewares/service-unavailable/errors/status/2 > /dev/null 2>&1 || true
        # proxy-api router. NO explicit priority: Traefik ranks it by rule length
        # (15) which beats the backend-unavailable catch-all's explicit priority 1
        # while keeping the same relative order against every other router that the
        # Docker-label version had.
        consul kv put traefik/http/routers/proxy-api/rule 'PathPrefix(`/`)'
        consul kv put traefik/http/routers/proxy-api/entryPoints/0 websecure
        consul kv put traefik/http/routers/proxy-api/service proxy-api-failover@consul
        consul kv put traefik/http/routers/proxy-api/tls/options strong-tls
        consul kv put traefik/http/routers/proxy-api/tls/certResolver "$${TRAEFIK_PROXY_API_CERT_RESOLVER}"
        # Middleware chain, written as an ordered index list. Trailing indices from
        # a previously longer chain (e.g. after the WAF overlay is removed) are
        # deleted AFTER the new ones are written, so the router is never briefly
        # invalid for a Traefik that is already running and watching this prefix.
        # The `:-` default is defence in depth: the chain must never be empty,
        # because service-unavailable@consul is what turns a 502/504 from a live
        # backend into a retryable envelope (#1334).
        #
        # The stale sweep ENUMERATES what is actually in KV rather than counting to
        # a fixed ceiling. The previous version deleted indices 0..7 only, but
        # TRAEFIK_PROXY_API_MIDDLEWARES is operator-supplied and has no enforced
        # eight-item limit: an operator who shortened a longer chain kept indices
        # >= 8 in KV, and Traefik went on applying those obsolete middlewares to the
        # public router forever. Enumerating makes the written list authoritative
        # for any previous length.
        _mw_existing=$$(consul kv get -keys traefik/http/routers/proxy-api/middlewares/ 2>/dev/null || true)
        _mw_list="$${TRAEFIK_PROXY_API_MIDDLEWARES:-service-unavailable@consul,hsts@consul}"
        _mw_idx=0
        while [ -n "$$_mw_list" ]; do
          case "$$_mw_list" in
            *,*) _mw_item="$${_mw_list%%,*}"; _mw_list="$${_mw_list#*,}" ;;
            *)   _mw_item="$$_mw_list";       _mw_list="" ;;
          esac
          [ -n "$$_mw_item" ] || continue
          consul kv put "traefik/http/routers/proxy-api/middlewares/$$_mw_idx" "$$_mw_item"
          _mw_idx=$$((_mw_idx + 1))
        done
        for _mw_key in $$_mw_existing; do
          _mw_stale="$${_mw_key##*/}"
          # Skip anything that is not a plain index (a nested key, or the prefix
          # itself) — only numbered chain entries are ours to remove.
          case "$$_mw_stale" in ''|*[!0-9]*) continue ;; esac
          if [ "$$_mw_stale" -ge "$$_mw_idx" ]; then
            consul kv delete "traefik/http/routers/proxy-api/middlewares/$$_mw_stale" > /dev/null 2>&1 || true
          fi
        done
        # Forward proxy (CONNECT mode) TCP passthrough. HSTS and TLS options are
        # HTTP-layer concerns and deliberately do not apply to a TCP router.
        consul kv put traefik/tcp/routers/forward-proxy/rule 'HostSNI(`*`)'
        consul kv put traefik/tcp/routers/forward-proxy/entryPoints/0 forward-proxy
        consul kv put traefik/tcp/routers/forward-proxy/service proxy-forward@consul
        consul kv put traefik/tcp/services/proxy-forward/loadBalancer/servers/0/address "$${PROXY_FORWARD_BACKEND_ADDRESS}"

  # ─── backend-unavailable responder (issue #1334) ─────────────────────────────
  # Always-up static sidecar that answers EVERY request with a retryable HTTP 503
  # carrying a Retry-After header and an Anthropic error-envelope body
  # ({"type":"error","error":{"type":"overloaded_error",...}}). Traefik routes
  # here (via the Consul KV catch-all router and the service-unavailable errors
  # middleware seeded by consul-init above) whenever the proxy backend is offline,
  # so Claude Code/CLI treats the blip as transient and retries instead of
  # reading a 404 as "model not found / no access".
  #
  # Runs on the proxy_net bridge and publishes its HTTP port on the host so the
  # host-networked Traefik reaches it at [::1]:8081 (matching the WAF sidecar
  # pattern). Listens plain-HTTP; TLS terminates at Traefik.
  backend-unavailable:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - proxy_net
    ports:
      # Bind to loopback only — this responder is internal to the host and must
      # not be exposed to the LAN. Traefik (network_mode: host) reaches it here.
      - "[::1]:8081:80"
    volumes:
      - ./backend-unavailable/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  traefik:
    image: traefik:v3
    # network_mode: host gives Traefik direct access to the host network stack.
    # This is required so that client source IPs are real (not Docker bridge IPs).
    # With host networking, port mappings are irrelevant — Traefik binds directly
    # to the host interfaces on the ports declared in entrypoints ([::]:443 etc.).
    # Note: network_mode: host is supported on Linux and macOS (Docker Desktop 4.34+
    # with host networking enabled — Settings → Resources → Network). The installer
    # detects and guides enablement automatically. Windows Docker Desktop does not
    # support host networking — use WSL2 or a Linux host.
    #
    # Docker label discovery still works with network_mode: host because Docker
    # socket access is independent of network mode. Traefik reads container
    # metadata via the Docker API socket, not via the network stack.
    # The proxy service also uses network_mode: host (required for mDNS multicast);
    # both Traefik and the proxy are on the host network stack so Traefik routes
    # to localhost:<port> directly — no Docker bridge network resolution needed.
    network_mode: host
    # env_file passes .env variables INTO the Traefik container environment.
    # Docker Compose --env-file / the .env file only feeds YAML variable
    # substitution (${VAR}) — it does NOT pass variables into containers.
    # Without env_file, CONSUL_HTTP_TOKEN is never set inside the Traefik
    # process, so all Consul KV reads fail with 403 and strong-tls@consul
    # TLS options are never loaded.
    env_file:
      - path: .env
        required: false
    command:
      # Consul KV provider: TLS options are seeded into Consul by consul-init (#240).
      # Traefik uses network_mode: host and reaches Consul at [::1]:8500 via the
      # published host port. rootkey=traefik matches the KV prefix used by consul-init.
      #
      # Startup race note: if Consul is unavailable when Traefik starts, Traefik
      # will load no TLS options from Consul and fall back to defaults (TLS 1.0
      # allowed). The depends_on: consul-init: service_completed_successfully ordering
      # below prevents this under normal operation.
      - "--providers.consul.endpoints=[::1]:8500"
      - "--providers.consul.rootkey=traefik"
      # Docker provider: discovers routing config from container labels
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      # File provider: operator drop-in directory (issue #1340).
      # A watched, read-only directory where operators may drop site-specific
      # Traefik dynamic config (*.yml/*.toml) — custom routers, middlewares,
      # redirects, headers — WITHOUT modifying the product templates. EMPTY by
      # default: a clean install loads nothing here, so behaviour is unchanged
      # until an operator drops a file. Coexists with the consul + docker
      # providers above. See docs/tls-setup.md ("Operator Traefik drop-in").
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints — IPv6-only; dual-stack where kernel has ipv6 enabled
      - "--entrypoints.websecure.address=[::]:443"
      - "--entrypoints.forward-proxy.address=[::]:8443"
      # Disable response buffering for SSE streaming
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=180s"
      # Dashboard and API disabled
      - "--api=false"
      # Liveness ping entrypoint (#1550 / #1551). Backs the container healthcheck
      # below so a Traefik process that cannot serve is visibly UNHEALTHY instead
      # of sitting "Up" while the ingress 404s. network_mode: host means
      # 127.0.0.1:8083 binds host loopback only — unpublished and unreachable
      # off-host (it appears in no `ports:` list). This is LIVENESS only; KV/route
      # health (strong-tls@consul resolvable) is covered by consul-kv-watchdog.
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=127.0.0.1:8083"
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      # Docker socket for label-based service discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Operator drop-in directory for custom Traefik dynamic config (issue #1340).
      # Read-only: Traefik only watches/reads it, never writes. Relative to this
      # compose file, so it resolves to <install-dir>/docker/traefik-dynamic/.
      # Created empty by install.sh and preserved (never wiped) on upgrade.
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      # Liveness (#1550 / #1551): proves the Traefik process is up and its ping
      # entrypoint responds. traefik:v3 is distroless (no curl/wget), so use the
      # built-in `traefik healthcheck` subcommand. It runs as a SEPARATE process
      # that does NOT inherit the main command's CLI flags, so the ping config is
      # repeated here so it resolves 127.0.0.1:8083/ping regardless of config source.
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=127.0.0.1:8083"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      # consul-init must complete before Traefik starts — ensures TLS options KV
      # entries are present before Traefik reads its Consul KV provider config.
      consul-init:
        condition: service_completed_successfully
      proxy:
        condition: service_started
      # backend-unavailable must be up so the 503 fallback responder is reachable
      # the moment Traefik starts routing (issue #1334).
      backend-unavailable:
        condition: service_started

  # ─── consul-kv-watchdog (#1550 / #1551) ──────────────────────────────────────
  # Runtime KV-drift detector: a tiny sidecar (reuses the consul image — no new
  # image) whose healthcheck READS the strong-tls TLS option that Traefik's consul
  # provider depends on. If the token is revoked/expires or the KV is wiped, the
  # read fails and this container goes UNHEALTHY — turning a silent ingress 404
  # into a visible signal that monitoring / `docker compose ps` catches.
  #
  # LIMITATION (documented — do NOT over-trust a green watchdog): in the installer
  # base stack Traefik is network_mode: host and reaches Consul at [::1]:8500,
  # while this sidecar reaches it over the bridge at consul:8500. It therefore
  # detects ACL/token/KV drift but NOT host-loopback/NAT networking drift on
  # Traefik's own path (a class this repo has hit before — installer bridge-NAT #1546).
  consul-kv-watchdog:
    image: hashicorp/consul:1.22
    restart: unless-stopped
    depends_on:
      consul-init:
        condition: service_completed_successfully
    networks:
      - proxy_net
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      # Same token as consul-init/Traefik (consul-init-rw: key_prefix "traefik/"
      # write ⇒ read allowed). Standard container-env injection, not a render-time
      # command substitution — no secret reaches the rendered compose/command.
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
    # Idle forever; all the signal is in the healthcheck.
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      # Read the exact KV Traefik's consul provider needs. A 403 (revoked token)
      # or a missing key makes `consul kv get` exit non-zero → unhealthy.
      # Since #1951 the data-plane router itself lives in this KV too, so the
      # probe covers it as well: losing traefik/http/routers/proxy-api is now an
      # ingress outage (every request falls through to the 529 responder), not
      # just a TLS-hardening regression.
      test: ["CMD-SHELL", "consul kv get traefik/tls/options/strong-tls/minVersion >/dev/null 2>&1 && consul kv get traefik/http/routers/proxy-api/rule >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: ${PROXY_SERVER_IMAGE:-ghcr.io/llm-api-proxy/server:${PROXY_VERSION:-edge}}
    # ── mDNS networking ──────────────────────────────────────────────────────────
    # mDNS (RFC 6762/6763) uses link-local multicast (IPv4: 224.0.0.251:5353,
    # IPv6: ff02::fb:5353). Multicast does NOT cross Docker bridge networks.
    # network_mode: host is REQUIRED on Linux so the proxy can send and receive
    # mDNS announcements on the host LAN.
    #
    # NOTE: Docker Desktop on macOS supports host networking since version 4.34
    # (opt-in feature — enable in Settings → Resources → Network). The installer
    # detects and guides enablement automatically. mDNS remains disabled on macOS
    # (multicast doesn't cross the Docker Desktop VM boundary).
    # For Docker Desktop < 4.34 or Windows, use the no-mdns override:
    #   docker compose -f docker-compose.yml -f docker-compose.no-mdns.yml up -d
    #
    # ── Port conflict warning ─────────────────────────────────────────────────────
    # With network_mode: host, the proxy binds DIRECTLY to the host interfaces.
    # Ports 3000 and 3001 are commonly used — if they conflict with other services
    # on your host, change them via environment variables BEFORE starting the stack:
    #   PROXY_LISTEN_PORT=3000        (reverse proxy + management API, default 3000)
    #   PROXY_FORWARD_PROXY__PORT=3001 (forward proxy / CONNECT mode, default 3001)
    # Set these in docker/.env or export them in your shell before running compose.
    #
    # ── DATABASE_URL with host networking ────────────────────────────────────────
    # With network_mode: host, the proxy is on the host network stack. TimescaleDB
    # publishes its port on the host loopback via "ports: [::1]:5432:5432", so the
    # correct address is localhost:5432 (not the Docker bridge hostname
    # "timescaledb"). The host-networked proxy reaches it over loopback.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      # Pass-through so operators can customise bind ports without editing compose.
      # Default 3000 — change if the port conflicts with another service on the host.
      PROXY_LISTEN_PORT: ${PROXY_LISTEN_PORT:-3000}
      # Default 3001 — change if the port conflicts with another service on the host.
      PROXY_FORWARD_PROXY__PORT: ${PROXY_FORWARD_PROXY__PORT:-3001}
      # With host networking, TimescaleDB is reachable at localhost:5432
      # (published via "ports: [::1]:5432:5432" on the timescaledb service).
      DATABASE_URL: postgres://${POSTGRES_USER:-proxy}:${POSTGRES_PASSWORD:-proxy_dev_password}@localhost:5432/${POSTGRES_DB:-llm_proxy}
      # Auth / encryption — populated by the installer in .env
      PROXY_JWT_SECRET: ${PROXY_JWT_SECRET:-}
      PROXY_KEK_VALUE: ${PROXY_KEK_VALUE:-}
      PROXY_KEK_PASSPHRASE: ${PROXY_KEK_PASSPHRASE:-}
      PROXY_ALLOW_FIRSTRUN_WIZARD: ${PROXY_ALLOW_FIRSTRUN_WIZARD:-true}
      # Consul KV — host networking means consul is at localhost
      CONSUL_HTTP_ADDR: http://localhost:8500
      CONSUL_HTTP_TOKEN: ${PROXY_CONSUL_TOKEN:-}
    depends_on:
      consul:
        condition: service_healthy
    # ── No Traefik labels on this container (issue #1951) ─────────────────────
    # Every product router, service and middleware is seeded into Consul KV by
    # consul-init above, NOT declared here. Traefik's Docker provider silently
    # drops all labels of a container whose Docker health status is not
    # "healthy", and this image ships a HEALTHCHECK, so labels here vanish for
    # the whole of every start-up/upgrade window — which is exactly how a public
    # hostname served the priority-1 backend-unavailable fallback (529) for 3.5
    # minutes after the proxy was already answering requests. Do not reintroduce
    # `traefik.*` labels on this service; add the keys to consul-init instead.

networks:
  proxy_net:
    # Docker allocates both subnets from the host's DHCPv6-PD-backed pools.
    # Never pin an address range in project source.
    enable_ipv6: true

volumes:
  timescaledb_data:
  consul_data:
