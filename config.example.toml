# ── Forward proxy CA certificate persistence ──────────────────────────────────
#
# Path to directory for persisting the forward proxy CA certificate.
# On first startup: CA cert and key are generated and written here.
# On subsequent startups: the existing pair is loaded from this directory.
# Partial state (one file without the other) causes a startup error.
# Expired CA causes a startup error — delete both files and restart to rotate.
# When unset: ephemeral CA is generated on each startup (development only).
# In production, set to the proxy_ca_data volume mount path (/ca).
# Env: PROXY_CA_STORAGE_DIR
# ca_storage_dir = "/ca"
#
# Alternative to ca_storage_dir: supply the CA cert and key directly as PEM
# strings. Both MUST be set together (setting only one is a startup error).
# When both are set they take precedence over ca_storage_dir. Use this when the
# CA material is managed externally (Vault, KMS, a mounted secret). The startup
# precedence is: (1) ca_cert_pem + ca_key_pem, (2) ca_storage_dir, (3) ephemeral.
# Env: PROXY_CA_CERT_PEM / PROXY_CA_KEY_PEM
# ca_cert_pem = "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----\n"
# ca_key_pem  = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
